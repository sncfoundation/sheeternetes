# A Pod that runs in a spreadsheet: it selects the virtual node and tolerates its taint.
apiVersion: v1
kind: Pod
metadata:
  name: hello-sheet
spec:
  nodeSelector:
    sheeternetes.io/sheet: "true"
  tolerations:
    - key: sheeternetes.io/sheet
      operator: Exists
      effect: NoSchedule
  containers:
    - name: hello
      image: busybox:1.36
      command: [sh, -c, "echo hello from a spreadsheet; sleep 3600"]
      resources:
        requests: {cpu: 100m, memory: 32Mi}
