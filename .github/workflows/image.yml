name: Image

# Publishes the Virtual Kubelet image used by virtual-kubelet/deploy/sheeternetes-vk.yaml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sheeternetes-vk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: virtual-kubelet/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sncfoundation/sheeternetes-vk:${{ github.ref_name }}
            ghcr.io/sncfoundation/sheeternetes-vk:latest
