name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control plane tests (Code.gs in Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every hack/test*.js
        run: |
          set -e
          for t in hack/test*.js; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
      - name: Same suite on the Apps Script scheduler
        run: SCHEDULER=script node hack/test.js

  shell:
    name: Shell scripts (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -e
          for f in $(git ls-files | xargs grep -lE '^#!/usr/bin/env bash' ); do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: shellcheck
        run: |
          git ls-files | xargs grep -lE '^#!/usr/bin/env bash' | xargs shellcheck

  manifests:
    name: Lab manifests are valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          for f in lab/*.json gitops/*.json; do echo "jq empty $f"; jq empty "$f"; done

  go:
    name: Go (vet + unit tests against the local apiserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  e2e-virtual-kubelet:
    name: E2E — a kind cluster runs a pod in a spreadsheet
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: helm/kind-action@v1
        with:
          cluster_name: sheeternetes-e2e
      - run: hack/e2e-virtual-kubelet.sh

  e2e-kube-facade:
    name: E2E — kubectl against a spreadsheet
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-kubectl@v4
      - name: fake kubelet
        run: hack/e2e-kube-facade.sh
      - name: real kubelet.sh + Docker
        run: KUBELET=docker APORT=8791 FPORT=6451 hack/e2e-kube-facade.sh
